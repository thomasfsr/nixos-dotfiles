# Effect
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 1
blur_params_radius = 3
blur_params_noise = 0.01
blur_params_brightness = 1.0
blur_params_contrast = 1.0
blur_params_saturation = 1.5

shadows = 0
layer_shadows = 1
shadow_only_floating=1
shadows_size = 5
shadows_blur = 10
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=none
animation_type_open=slide
animation_type_close=none
animation_fade_in=1
animation_fade_out=0
tag_animation_direction=1
zoom_initial_ratio=0.7
zoom_end_ratio=1.0
fade_in_begin_opacity=0.7
fade_out_begin_opacity=0.8
animation_duration_move=300
animation_duration_open=350
animation_duration_tag=300
animation_duration_close=250
animation_duration_focus=250
animation_curve_open=0.22,1.0,0.36,1.0
animation_curve_move=0.22,1.0,0.36,1.0
animation_curve_tag=0.22,1.0,0.36,1.0
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.22,1.0,0.36,1.0
animation_curve_opafadeout=0.58,0.98,0.58,0.98
animation_curve_opafadein=0.22,1.0,0.36,1.0

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
smart_gaps=0
default_master_factor=0.55
default_master_count=1

# Overview Setting
hotarea_size=5
enable_hotarea=1
# ov_tab_mode=0
overview_gap_inner=5
overview_gap_outer=30

# Misc
# xwayland_persistence=1
# syncobj_enable=0
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
# circle_layout=tile,scroller
enable_floating_snap=0
snap_distance=50
cursor_size=24
# cursor_theme=Bibata-Original-Classic
# cursor_hide_timeout=0
drag_tile_to_tile=1
# single_scratchpad = 1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon_on=1
xkb_rules_layout=br
# xkb_rules_variant=abnt2
# xkb_rules_model=pc105
# xkb_rules_options=ctrl:nocaps
# xkb_rules_options=grp:alt_altgr_toggle,caps:hyper

# Trackpad
# trackpad_disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
# mouse_accel_profile=2
# mouse_accel_speed=0.0
# scroll_button=274
# scroll_method=1

# Appearance
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0

scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=0
root_color=0x1e1e2eff
border_color=0x313244ff
focus_color=0x89b4faff
maximized_screen_color=0xa6e3a1ff
urgent_color=0xf38ba8ff
scratchpad_color=0xcba6f7ff
global_color=0x94e2d5ff
overlay_color=0xf9e2afff

# sub config load
source=./env.conf
source=./bind.conf
source=./monitor.conf
source=./tag.conf
exec-once=~/.config/mango/autostart.sh
